name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend and rules
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore backend
        run: dotnet restore src/backend/QuizMaster.Api/QuizMaster.Api.csproj
      - name: Build backend
        run: dotnet build src/backend/QuizMaster.Api/QuizMaster.Api.csproj --configuration Release --no-restore
      - name: Run rule checks
        run: dotnet run --project tests/QuizMaster.RuleChecks/QuizMaster.RuleChecks.csproj --configuration Release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
