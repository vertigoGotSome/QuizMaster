name: Bug report
description: Report a reproducible problem in QuizMaster.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Thank you for taking the time to report a problem. Please do not include secrets, OAuth codes, or personal data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start ...
        2. Open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication
        - Imposter
        - WWM
        - Jeopardy
        - Storage
        - Camera or live updates
        - Deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Remove tokens, IDs, URLs with OAuth codes, and other sensitive data.
